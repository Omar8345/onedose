<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light only" />
  <title>{{subject}}</title>
</head>
<body bgcolor="#F4F0E8" style="margin:0;padding:0;background-color:#F4F0E8;color:#18342D;font-family:Arial,Helvetica,sans-serif">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent">{{preheader}}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#F4F0E8" style="width:100%;background-color:#F4F0E8">
    <tr>
      <td align="center" style="padding:40px 16px">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px">
          <tr>
            <td style="padding:0 0 18px 2px">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td width="36" height="36" align="center" valign="middle" bgcolor="#E96C57" style="width:36px;height:36px;background-color:#E96C57;border-radius:10px;color:#FFF8EF;font-size:20px;font-weight:700;line-height:36px">1</td>
                  <td style="padding-left:11px;color:#18342D;font-size:21px;font-weight:700;line-height:1">OneDose</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td bgcolor="#FFFFFF" style="background-color:#FFFFFF;border:1px solid #DED8CC;border-radius:20px;overflow:hidden">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr><td height="8" bgcolor="#E96C57" style="height:8px;background-color:#E96C57;font-size:0;line-height:0">&nbsp;</td></tr>
                <tr>
                  <td style="padding:38px 40px 36px">
                    <p style="margin:0 0 16px;color:#B44E3D;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase">Care circle follow-up</p>
                    <h1 style="margin:0;color:#18342D;font-size:32px;line-height:1.15;font-weight:700">{{heading}}</h1>
                    <div style="margin-top:16px;color:#5E6D67;font-size:16px;line-height:1.65"><p style="margin:0">{{message}}</p></div>
                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:26px 0 0"><tr><td bgcolor="#F4F0E8" style="background-color:#F4F0E8;border-left:4px solid #E96C57;padding:15px 18px"><p style="margin:0 0 5px;color:#75817C;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase">Care circle</p><p style="margin:0;color:#18342D;font-size:16px;font-weight:700">{{circle}}</p></td></tr></table>
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:28px 0 0"><tr><td align="center" bgcolor="#E96C57" style="background-color:#E96C57;border-radius:10px"><a href="{{appUrl}}" target="_blank" style="display:inline-block;color:#FFFFFF;font-size:16px;font-weight:700;line-height:48px;text-decoration:none;padding:0 24px">{{buttonLabel}}</a></td></tr></table>
                    <p style="margin:24px 0 0;color:#7A8580;font-size:13px;line-height:1.6">OneDose coordinates shared care records. Confirm the situation with your care circle before acting.</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 4px 0;color:#75817C;font-size:12px;line-height:1.6"><strong style="color:#52625A">OneDose</strong> &middot; One clear record for everyone who helps with care.</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
